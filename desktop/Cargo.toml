[package]
name = "agent-desk-desktop"
version = "0.1.0"
description = "Agent Desk as a macOS app: a window around the agent-desk server"
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
